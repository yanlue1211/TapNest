<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TapNest 网页模型引擎 V0.12</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent!important;overflow:hidden;font-family:system-ui,sans-serif}
#stage{width:100%;height:100%;position:relative;overflow:hidden;touch-action:none}
#petArea{position:absolute;left:50%;right:auto;width:min(var(--pet-size,100%),100%);height:var(--pet-size,100%);transform:translateX(-50%);top:0;bottom:auto;overflow:hidden;pointer-events:none}
#canvas{width:100%;height:100%;display:block;pointer-events:none}
/* V0.12: bubble starts at the ACTUAL opaque bottom of the PNG model.
   A permanent empty strip is BELOW the bubble; the bubble grows downward. */
#bubble{position:absolute;z-index:4;top:var(--bubble-top,var(--pet-size,100%));bottom:auto;left:4px;right:4px;width:auto;max-height:210px;overflow-y:auto;overflow-x:hidden;padding:5px 8px;border:1px solid #c9ebdb;border-radius:12px;box-shadow:0 3px 9px #278c633b;background:#fffffff0;color:#3c7463;font-weight:600;font-size:12px;line-height:1.38;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;opacity:0;transition:opacity .14s;pointer-events:auto;touch-action:pan-y;overscroll-behavior:contain}
#bubble.show{opacity:1}
#hit{position:absolute;inset:12% 6% 10%;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}
/* Chat opens on DOUBLE TAP. Window height can grow below the unchanged pet. */
#chat{display:none;position:absolute;top:var(--bubble-top,var(--pet-size,100%));bottom:auto;left:4px;right:4px;height:45px;z-index:5;border:1px solid #b4e8d0;border-radius:13px;background:#f9fffce8;padding:5px;justify-content:center;align-items:center;flex-direction:row;gap:4px;touch-action:auto;box-shadow:0 3px 12px #245b4344}
#stage.chatting #bubble{opacity:0!important}
#chat.open{display:flex}
#chat label{display:none}
#chat input{flex:1;min-width:0;width:0;height:32px;min-height:32px;border:1px solid #b7ddc6;border-radius:9px;padding:4px 5px;font-size:12px;background:white;color:#205442;outline-color:#4cc69b}
#actions{display:flex;flex:0 0 auto;gap:3px}
#actions button{flex:0 0 25px;width:25px;min-height:32px;padding:0;border:0;border-radius:9px;background:#6bd9b0;color:#145944;font-size:11px;font-weight:bold}
#actions button:last-child{background:#e3f0e9}
#status{position:absolute;bottom:5px;left:5px;right:5px;text-align:center;white-space:normal;font-size:10px;color:#7b7878;pointer-events:none}
#demo{position:absolute;inset:17%;pointer-events:none;display:grid;place-items:center;font-size:64px;filter:drop-shadow(0 8px 8px #4a987355);animation:idle 3s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(4px) rotate(2deg)}}
@media(prefers-reduced-motion:reduce){#demo{animation:none}}
</style>
</head>
<body>
<div id="stage">
<div id="petArea"><canvas id="canvas"></canvas>
<div id="demo">🐶</div>
<div id="hit" aria-label="桌宠，点击互动，长按聊天"></div></div>
<div id="bubble" aria-live="polite"></div>
<form id="chat"><label>🐾 想对我说什么？</label><input id="message" maxlength="200" placeholder="和小狗说句话……"><div id="actions"><button type="submit">发送</button><button type="button" id="cancel">取消</button></div></form>
<div id="status"></div>
</div>
<script>
(()=>{
"use strict";
// Model payload is supplied by the AutoJs6 script via an inline JSON variable
// inserted before </head>. Nothing is fetched or uploaded by this page.
const pack=window.TAPNEST_PACK||null;
const canvas=document.getElementById("canvas"),box=document.getElementById("bubble"),form=document.getElementById("chat");

const demo=document.getElementById("demo");
const clamp=(v,a,b)=>Math.min(b,Math.max(a,Number(v)||0));
const rad=x=>x*Math.PI/180;
const lerp=(a,b,t)=>a+(b-a)*t;
const lerpAngle=(a,b,t)=>a+Math.atan2(Math.sin(b-a),Math.cos(b-a))*t;
const ID=[1,0,0,1,0,0];
function mul(A,B){return [
 A[0]*B[0]+A[2]*B[1],A[1]*B[0]+A[3]*B[1],
 A[0]*B[2]+A[2]*B[3],A[1]*B[2]+A[3]*B[3],
 A[0]*B[4]+A[2]*B[5]+A[4],A[1]*B[4]+A[3]*B[5]+A[5]
]}
function T(x,y){return [1,0,0,1,x,y]}
function S(x,y){return [x,0,0,y,0,0]}
function R(deg){let a=rad(deg);return [Math.cos(a),Math.sin(a),-Math.sin(a),Math.cos(a),0,0]}
function point(M,x,y){return [M[0]*x+M[2]*y+M[4],M[1]*x+M[3]*y+M[5]]}
const pose0=()=>({x:0,y:0,angle:0,scaleX:1,scaleY:1,alpha:1});
function sample(clip,id,age){
 const track=(clip.tracks||[]).find(t=>t.layerId===id);if(!track||!track.frames?.length)return pose0();
 const frames=track.frames.slice().sort((a,b)=>a.atMs-b.atMs),dur=Math.max(0,clip.durationMs||0);
 const t=clip.loop&&dur>0?((age%dur)+dur)%dur:clamp(age,0,dur);
 if(t<=frames[0].atMs)return {...pose0(),...frames[0].pose};
 if(t>=frames[frames.length-1].atMs)return {...pose0(),...frames[frames.length-1].pose};
 const i=frames.findIndex((f,j)=>j<frames.length-1&&f.atMs<=t&&frames[j+1].atMs>t);
 const a=frames[i],b=frames[i+1],span=b.atMs-a.atMs;

}
function blink(t){
 const n=Math.floor(t/5200);
 const scramble=(((Math.imul(n,1103515245)+12345)|0)^Math.imul(n+17,2654435761))>>>0;

function segmentAngles(l,t){
 const b=l.bones||[],n=b.length-1,amp=clamp(l.idleAmplitude??10,0,40),speed=clamp(l.idleSpeed??.7,.1,3);

 return amp*weight*Math.sin(2*Math.PI*speed*(Math.max(0,t)/1000-i*lag));

}
const springs=new Map();
function springAngles(l,elapsed){
 const n=l.bones.length-1,now=Math.max(0,elapsed),speed=clamp(l.idleSpeed??.7,.1,3);
 const amp=clamp(l.idleAmplitude??10,0,85),soft=clamp(l.springSoftness??.72,0,1),damp=clamp(l.springDamping??.4,.1,1.3);
 const omega=2*Math.PI*(3.3-2.6*soft),driveOmega=2*Math.PI*speed;
 const first=l.bones[0],last=l.bones[l.bones.length-1],dx=last.x-first.x,dy=last.y-first.y;

 const driver=t=>one?sign*amp*.5*(1-Math.cos(driveOmega*t/1000)):amp*Math.sin(driveOmega*t/1000);
 let state=springs.get(l.id);
 if(!state||state.count!==n||now<state.t||now-state.t>600){
  state={count:n,t:now,a:Array(n).fill(driver(now)),v:Array(n).fill(0)};
  springs.set(l.id,state);

  const steps=Math.max(1,Math.min(80,Math.ceil((now-state.t)/8)));
  const dt=(now-state.t)/steps/1000,old=state.t;
  for(let s=1;s<=steps;s++){
   state.a[0]=driver(old+(now-old)*s/steps);
   for(let i=1;i<n;i++){
    const acc=omega*omega*(state.a[i-1]-state.a[i])-2*damp*omega*state.v[i];
    let v=clamp(state.v[i]+acc*dt,-550,550),a=clamp(state.a[i]+v*dt,-100,100);

   }

function rot(x,y,a){return [x*Math.cos(a)-y*Math.sin(a),x*Math.sin(a)+y*Math.cos(a)]}
function deformedVertices(layer,w,h,t,N,angles){

  sum+=rad(a[i-1]);

  const dir=i===1&&d==="AUTO"?(bones[0].swingDirection||"AUTO"):d;

  let q=rot(...diff,dir==="ROTATION_REVERSE"?-sum:sum);

  const vx=col*w/N,vy=row*h/N;let best=Infinity,idx=0,progress=0;
  for(let j=0;j<n-1;j++){

   if(dd<best){best=dd;idx=j;progress=u;}
  }
  const b=base[idx],c=base[idx+1],p=transformed[idx],q=transformed[idx+1];
  const ox=lerp(b[0],c[0],progress),oy=lerp(b[1],c[1],progress);
  const nx=lerp(p[0],q[0],progress),ny=lerp(p[1],q[1],progress);
  const smooth=progress*progress*(3-2*progress);

  const s=rot(vx-ox,vy-oy,angle),soft=[nx+s[0],ny+s[1]];
  const rigid=linear?soft:(()=>{let r=rot(vx-base[0][0],vy-base[0][1],joint[0]);return [base[0][0]+r[0],base[0][1]+r[1]]})();

}
// Keep native TapNestPresets keyframes: NOD / BOUNCE / FLAP / TWITCH must not all become shakes.
// A mirrored clone inherits motion polarity from its SOURCE, because
// the whole-character canvas reflection already reverses visual direction.
// Matching TapNestSymmetry.idleSwingSign in the Android original avoids
// double-flipping wing_left -> wing_right copied artwork.
function sourceMotionId(layer){
 return typeof layer.mirroredFromId==="string"&&layer.mirroredFromId ? layer.mirroredFromId : layer.id;
}
function idleSwingSign(layer){
 const source=sourceMotionId(layer);
 return source.endsWith("_left")&&source.includes("wing") ? -1 : 1;
}
function presetPose(layer,elapsed){
 const type=layer.tapMotion||"NOD",id=layer.id,motionId=sourceMotionId(layer);

 let frames=[],dur=680;
 if(type==="BOUNCE"){
  dur=550;frames=[pose(0,{}),pose(100,{scaleX:1.07,scaleY:.92,y:5}),pose(240,{scaleX:.96,scaleY:1.05,y:-16}),pose(420,{scaleX:1.02,scaleY:.97,y:2}),pose(550,{})];
 }else if(type==="FLAP"){
  const sign=motionId.endsWith("left")?-1:1;
  frames=[pose(0,{}),pose(160,{angle:15*sign}),pose(330,{angle:-7*sign}),pose(500,{angle:5*sign}),pose(680,{})];
 }else if(type==="TWITCH"){
  const sign=id.endsWith("right")?1:-1;
  dur=420;frames=[pose(0,{}),pose(90,{angle:9*sign}),pose(205,{angle:-4*sign}),pose(420,{})];
 }else{
  frames=[pose(0,{}),pose(120,{angle:3,y:1}),pose(270,{angle:8,y:3}),pose(440,{angle:-2.5,y:-1}),pose(560,{angle:-1}),pose(680,{})];
 }
 return sample({durationMs:dur,tracks:[{layerId:id,frames}]},id,elapsed);
}
const getClipPose=(r,l,t,tapAge)=>{
 const clip=(r.clips||[]).find(c=>(c.tracks||[]).some(tr=>tr.layerId===l.id));
 if(clip)return sample(clip,l.id,clip.loop?t:Math.max(0,tapAge));
 let pose=pose0();
 const touched=tapAge>=0&&tapAge<680;
 if(l.interactionConfigured){
  const pulse=periodicElapsed(l,t);
  if(l.tapShake&&touched)pose=presetPose(l,tapAge);
  else if(!touched&&l.periodicAction==="SHAKE"&&pulse!==null)pose=presetPose(l,pulse);
 }else if(l.id==="tail"&&!l.idleSwing){
  pose.angle=15*Math.sin(t/1000*2*Math.PI/0.8);
 }else if((l.id.startsWith("head_")||l.id==="head_blank")&&touched){
  pose=presetPose({...l,tapMotion:"NOD"},tapAge);
 }
 if(l.idleSwing&&(!l.bones||l.bones.length<2)){
  // Do NOT multiply by mirrorX: the render transform already reflects it.
  // A copied right wing must retain its source's local motion phase.
  const sign=idleSwingSign(l);
  pose.angle+=sign*clamp(l.idleAmplitude??10,0,40)*Math.sin(t/1000*2*Math.PI*clamp(l.idleSpeed??.7,.1,3));

};
function periodicElapsed(l,t){
 if(!l.interactionConfigured||!l.periodicEnabled)return null;

function isImageName(name){return typeof name==="string"&&/^[A-Za-z0-9_-]+\.png$/i.test(name)}
function validate(p){
 const r=p.rig;
 if(!r||!Number.isInteger(r.canvasWidth)||!Number.isInteger(r.canvasHeight)||r.canvasWidth<1||r.canvasHeight<1||r.canvasWidth>4096||r.canvasHeight>4096)throw Error("模型画布尺寸无效");
 if(!Array.isArray(r.layers)||r.layers.length<1||r.layers.length>48)throw Error("模型图层数量无效");
 for(let l of r.layers)if(!l||typeof l.id!=="string"||l.id.length>100||!isImageName(l.image)&&l.image!=="")throw Error("图层 ID 或 PNG 文件名不合法");

let rig=null,assets=new Map(),names=new Map(),started=performance.now(),tapTime=-1e9,tapCount=0,activeTapExpression=0,raf=0,canvas2d=null,gl=null,prog=null;
let draggingPet=false,pickedUpAt=0,bubbleAnchorPx=0;
let buffPos,buffUv,ibuffer,uSize,uTex,uAlpha,aPos,aUV,viewport={w:220,h:220};
const dpr=Math.min(2,window.devicePixelRatio||1);
function resize(){
 const width=Math.max(1,canvas.clientWidth),height=Math.max(1,canvas.clientHeight);

 if(gl)gl.viewport(0,0,canvas.width,canvas.height);
 // The bubble anchor is measured in logical CSS pixels, not PNG image pixels.
 if(rig&&assets.size)measureOpaqueBottom();
}
function measureOpaqueBottom(){
 // One-time low-resolution alpha composite of the *rest pose*. This avoids
 // guessed margins: imported art often has large transparent PNG padding.
 if(!rig||!assets.size)return;
 try{
  const size=160, c=document.createElement("canvas");
  c.width=c.height=size;
  const ctx=c.getContext("2d",{willReadFrequently:true});
  if(!ctx)return;
  const factor=Math.min(size/rig.canvasWidth,size/rig.canvasHeight);
  const shiftX=(size-rig.canvasWidth*factor)/2,shiftY=(size-rig.canvasHeight*factor)/2;
  const map=new Map(rig.layers.map(l=>[l.id,l]));
  for(const layer of rig.layers.slice().sort((a,b)=>(a.zIndex||0)-(b.zIndex||0))){
   if(layer.frameOwner||layer.id==="pickup_pose"||(!layer.image))continue;
   if(/^head_[1-9]/.test(layer.id)||/^face_[1-9]/.test(layer.id))continue;
   if(layer.id==="wing_1"||layer.id==="bow_1")continue;
   const img=assets.get(layer.id);if(!img)continue;

   while(node&&!visited.has(node.id)&&chain.length<32){chain.unshift(node);visited.add(node.id);node=node.parentId?map.get(node.parentId):null}

function shader(type,src){

function initializeGL(){

function textureFor(image){

const grids=new Map();
function grid(N){
 if(grids.has(N))return grids.get(N);

}
function drawWebGL(l,img,matrix,t,alpha,held=false){
 const canMesh=!held&&l.idleSwing&&Array.isArray(l.bones)&&l.bones.length>=2&&l.bones.length<=8;
 const N=canMesh?(l.swingMode==="SPRING"?32:16):1,G=grid(N),w=img.logicalWidth,h=img.logicalHeight;
 let verts=canMesh?deformedVertices(l,w,h,t,N,l.swingMode==="SPRING"?springAngles(l,t):null):new Float32Array([0,0,w,0,0,h,w,h]);
 // 1x1 grid order is (0,0),(w,0),(0,h),(w,h)
 const pos=new Float32Array(verts.length);
 const k=Math.min(viewport.w/rig.canvasWidth,viewport.h/rig.canvasHeight);
 const offsetX=(viewport.w-rig.canvasWidth*k)/2,offsetY=(viewport.h-rig.canvasHeight*k)/2;
 for(let i=0;i<verts.length;i+=2){
  const q=point(matrix,verts[i],verts[i+1]);
  pos[i]=q[0]*k+offsetX;pos[i+1]=q[1]*k+offsetY;
 }
 gl.bindBuffer(gl.ARRAY_BUFFER,buffPos);gl.bufferData(gl.ARRAY_BUFFER,pos,gl.STREAM_DRAW);
 gl.vertexAttribPointer(aPos,2,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ARRAY_BUFFER,buffUv);gl.bufferData(gl.ARRAY_BUFFER,G.uv,gl.STREAM_DRAW);
 gl.vertexAttribPointer(aUV,2,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibuffer);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,G.indices,gl.STREAM_DRAW);
 gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,img.texture);
 gl.uniform1i(uTex,0);gl.uniform1f(uAlpha,clamp(alpha,0,1));gl.uniform2f(uSize,viewport.w,viewport.h);
 gl.drawElements(gl.TRIANGLES,G.indices.length,gl.UNSIGNED_SHORT,0);
}
function draw2D(l,img,matrix,t,alpha){
 const ctx=canvas2d,scale=Math.min(viewport.w/rig.canvasWidth,viewport.h/rig.canvasHeight);
 const offX=(viewport.w-rig.canvasWidth*scale)/2,offY=(viewport.h-rig.canvasHeight*scale)/2;
 ctx.save();ctx.translate(offX,offY);ctx.scale(scale,scale);
 ctx.transform(...matrix);ctx.globalAlpha=clamp(alpha,0,1);
 // Compatibility fallback: rigid rendering only when WebGL is unavailable.
 ctx.drawImage(img.image,0,0,img.logicalWidth,img.logicalHeight);ctx.restore();
}
function chooseOwners(r,t,age){
 const firstByOwner=new Map();
 const available=new Set([...assets.keys()]);
 for(let l of r.layers){
  if(l.frameOwner)continue;
  let active=l.id;
  if(l.interactionConfigured){
   let requested=0;
   if(l.tapSwitchFrame&&age>=0&&age<1000)requested=l.tapFrame||1;
   else if(l.idleBlinkEnabled&&age>1400&&blink(t))requested=l.blinkFrame||1;
   else if(l.periodicEnabled&&l.periodicAction==="SWITCH_FRAME"&&periodicElapsed(l,t)!==null&&age>1400)requested=l.periodicFrame||1;
   const child=r.layers.find(f=>f.frameOwner===l.id&&f.frameIndex===requested&&available.has(f.id));
   if(child)active=child.id;
  }
  firstByOwner.set(l.id,active);
 }
 return firstByOwner;
}
function draw(time){
 if(!rig)return;
 const elapsed=Math.max(0,time-started),age=time-tapTime;
 const held=draggingPet,heldMs=Math.max(0,time-pickedUpAt);
 const pickupAngle=held?8*Math.sin(heldMs/1000*2*Math.PI*1.25):0;
 const cx=rig.canvasWidth*.5;
 const pickupTransform=mul(mul(T(cx,0),R(pickupAngle)),T(-cx,0));
 // Original TapNest: with "pickupArtworkEnabled", one special full-frame
 // image replaces every individual part while moving; no wing/head animations.
 const special=held&&rig.pickupArtworkEnabled&&assets.get("pickup_pose");
 if(special){
  const picture=assets.get("pickup_pose");
  const part=rig.layers.find(l=>l.id==="pickup_pose");
  const sc=clamp(part?.restScale??1,.3,3);
  const matrix=mul(pickupTransform,mul(mul(T(cx,0),S(sc,sc)),T(-cx,0)));
  gl&&gl.clearColor(0,0,0,0);gl&&gl.clear(gl.COLOR_BUFFER_BIT);
  if(canvas2d)canvas2d.clearRect(0,0,canvas.width,canvas.height);
  if(gl)drawWebGL(part||{id:"pickup_pose"},picture,matrix,elapsed,1,true);
  else draw2D(part||{id:"pickup_pose"},picture,matrix,elapsed,1);
  if(!document.hidden)raf=requestAnimationFrame(draw);
  return;
 }
 gl&&gl.clearColor(0,0,0,0);
 gl&&gl.clear(gl.COLOR_BUFFER_BIT);
 if(canvas2d)canvas2d.clearRect(0,0,canvas.width,canvas.height);
 const faceType=rig.headMode==="BLANK_HEAD_WITH_FACE"?"face_":"head_";
 const expression=held?0:age>=0&&age<1800?activeTapExpression:rig.blinkExpression>=0&&blink(elapsed)&&age>1400?rig.blinkExpression:0;
 const face=faceType+expression;
 const byId=new Map(rig.layers.map(l=>[l.id,l]));
 const currentFrames=held?new Map(rig.layers.filter(l=>!l.frameOwner).map(l=>[l.id,l.id])):chooseOwners(rig,elapsed,age);
 const poses=new Map();
 function getPose(l){
  if(poses.has(l.id))return poses.get(l.id);
  const result=held?pose0():getClipPose(rig,l,elapsed,age);
  poses.set(l.id,result);return result;
 }
 for(let layer of rig.layers.slice().sort((a,b)=>(a.zIndex||0)-(b.zIndex||0))){
  if(layer.frameOwner)continue;
  if(layer.id==="pickup_pose")continue;
  if(layer.id==="wing_0"||layer.id==="wing_1"){
   const wanted=(!held&&age>=0&&age<680&&assets.has("wing_1"))?"wing_1":"wing_0";
   if(layer.id!==wanted)continue;
  }
  if(layer.id==="bow_0"||layer.id==="bow_1"){
   const wanted=(!held&&age>=0&&age<680&&assets.has("bow_1"))?"bow_1":"bow_0";
   if(layer.id!==wanted)continue;
  }
  if(layer.id.startsWith("head_")&&layer.id!=="head_blank"){
   if(faceType!=="head_"||layer.id!==face&&!(!assets.has(face)&&layer.id==="head_0"))continue;
  }
  if(layer.id==="head_blank"&&faceType!=="face_")continue;
  if(layer.id.startsWith("face_")&&(faceType!=="face_"||layer.id!==face&&!(!assets.has(face)&&layer.id==="face_0")))continue;
  const selected=currentFrames.get(layer.id)||layer.id;
  const img=assets.get(selected)||assets.get(layer.id);if(!img)continue;
  const chain=[],seen=new Set();
  let node=layer;
  while(node&&!seen.has(node.id)&&chain.length<32){chain.unshift(node);seen.add(node.id);node=node.parentId?byId.get(node.parentId):null}
  let matrix=held?pickupTransform:ID,alpha=1;
  if(layer.mirrorX)matrix=mul(matrix,mul(T(rig.canvasWidth,0),S(-1,1)));
  for(let l of chain){
   let p=getPose(l),q=assets.get(currentFrames.get(l.id))||assets.get(l.id),w=q?.logicalWidth||rig.canvasWidth,h=q?.logicalHeight||rig.canvasHeight;
   const pivotX=clamp(l.pivotX??.5,0,1)*w,pivotY=clamp(l.pivotY??.5,0,1)*h,scale=clamp(l.restScale??1,.1,4);
   matrix=mul(matrix,T((l.x||0)+(p.x||0)+pivotX*scale,(l.y||0)+(p.y||0)+pivotY*scale));
   matrix=mul(matrix,R(p.angle||0));
   matrix=mul(matrix,S(scale*(p.scaleX??1),scale*(p.scaleY??1)));
   matrix=mul(matrix,T(-pivotX,-pivotY));alpha*=p.alpha??1;
  }
  if(gl)drawWebGL(layer,img,matrix,elapsed,alpha,held);
  else draw2D(layer,img,matrix,elapsed,alpha);
 }
 if(!document.hidden)raf=requestAnimationFrame(draw);
}
function talk(message){
 // Bubble width is fixed to the window, but its height grows BELOW the pet.
 // Native overlay polls the rendered bubble height and adjusts only the window.
 clearTimeout(talk.timer);
 const content=String(message);
 box.textContent=content;
 box.scrollTop=0;
 box.classList.add("show");
 const readingMs=Math.min(18000,Math.max(3500,2000+Array.from(content).length*175));
 talk.timer=setTimeout(()=>box.classList.remove("show"),readingMs);
}
function tap(){
 tapTime=performance.now();tapCount++;
 activeTapExpression=rig&&Number.isInteger(rig.tapExpression)&&rig.tapExpression>=0&&rig.tapExpression<=3?rig.tapExpression:((tapCount-1)%3)+1;
 talk(["嘿嘿！","我在呢～","被你戳到啦！","好痒～"][tapCount%4]);
}
function openChat(){
 clearTimeout(singleTapTimer);
 clearTimeout(talk.timer);
 box.classList.remove("show");
 form.classList.add("open");
 document.getElementById("stage").classList.add("chatting");
 // Focus is taken by AutoJs6 AFTER double-tap detection; it will re-focus input.
 try{input.focus()}catch(_){}
}
function closeChat(){
 form.classList.remove("open");
 document.getElementById("stage").classList.remove("chatting");
 input.blur();
}
let pressed=false,moved=false,x=0,y=0,pressAt=0,lastTap=0,lastTapX=0,lastTapY=0,singleTapTimer=0,suppressTapUntil=0;
hit.addEventListener("pointerdown",e=>{
 if(form.classList.contains("open"))return;
 pressed=true;moved=false;x=e.clientX;y=e.clientY;pressAt=performance.now();
});
hit.addEventListener("pointermove",e=>{if(pressed&&Math.hypot(e.clientX-x,e.clientY-y)>12)moved=true});
hit.addEventListener("pointerup",e=>{
 const now=performance.now(),duration=now-pressAt;
 if(pressed&&!moved&&duration<550&&!form.classList.contains("open")&&!draggingPet&&now>=suppressTapUntil){
  // Delayed single-tap reaction prevents the first double-tap from playing an action.
  const isDouble=lastTap>0&&now-lastTap<=360&&Math.hypot(e.clientX-lastTapX,e.clientY-lastTapY)<40;
  if(isDouble){
   clearTimeout(singleTapTimer);singleTapTimer=0;lastTap=0;openChat();
  }else{
   lastTap=now;lastTapX=e.clientX;lastTapY=e.clientY;
   clearTimeout(singleTapTimer);
   singleTapTimer=setTimeout(()=>{
    singleTapTimer=0;lastTap=0;
    if(!form.classList.contains("open"))tap();
   },365);
  }
 }
 // A motionless hold >= 5s is closed by the native AutoJs6 timer.
 // Short holds do not open chat and are not mistaken for taps.
 pressed=false;
});
hit.addEventListener("pointercancel",()=>{pressed=false;clearTimeout(singleTapTimer);lastTap=0});
form.addEventListener("submit",e=>{
 e.preventDefault();if(!input.value.trim())return;
 input.value="";closeChat();talk("我听到啦！等接上糯米机就能认真回答～");
});
document.getElementById("cancel").addEventListener("click",closeChat);
document.addEventListener("contextmenu",e=>e.preventDefault());
window.PetPreview=Object.freeze({openChat,closeChat,tap,
 getState:()=>{
  const open=form.classList.contains("open");
  const visible=box.classList.contains("show")&&!open;
  const contentHeight=visible?Math.ceil(box.getBoundingClientRect().height):0;
  // Default leaves blank space BELOW the bubble; longer messages increase
  // only the window's downward extent, never the bubble's top coordinate.
  const required=(open?54:(visible?Math.min(220,contentHeight+9):0));
  const extra=Math.max(76,Math.ceil(bubbleAnchorPx+required-viewport.h+8));
  return [open?1:0,Math.min(230,extra)].join("|");
 },
 setDragging:(isDragging)=>{
  const next=!!isDragging;
  if(next===draggingPet)return;
  draggingPet=next;
  if(next){pickedUpAt=performance.now();clearTimeout(singleTapTimer);lastTap=0;}
  else suppressTapUntil=performance.now()+220;
 },
 version:"0.12"});
window.addEventListener("resize",resize);
document.addEventListener("visibilitychange",()=>{if(document.hidden)cancelAnimationFrame(raf);else if(rig)raf=requestAnimationFrame(draw)});
async function initialize(){
 resize();
 if(!pack){status.textContent="演示模式 · 尚未导入 TapNest 模型";return}
 try{
  rig=validate(pack);
  const list=rig.layers.filter(l=>l.image&&pack.assets[l.image]);
  await Promise.all(list.map(l=>new Promise((resolve,reject)=>{
   const pic=new Image();pic.onload=()=>{
    if(pic.naturalWidth>4096||pic.naturalHeight>4096){reject(Error("图层尺寸超出限制："+l.image));return}
    const original=pack.dimensions?.[l.image]||[pic.naturalWidth,pic.naturalHeight];
    assets.set(l.id,{image:pic,texture:null,logicalWidth:original[0],logicalHeight:original[1]});resolve();
   };
   pic.onerror=()=>reject(Error("图片损坏："+l.image));
   pic.src=pack.assets[l.image];
  })));
  if(!assets.has("body"))throw Error("模型缺少身体图层 body.png");
  measureOpaqueBottom();
  try{initializeGL()}catch(e){gl=null;status.textContent="WebGL 不可用，改用普通图层渲染";}
  if(gl)for(let item of assets.values())item.texture=textureFor(item.image);
  if(!gl){canvas2d=canvas.getContext("2d");canvas2d.setTransform(dpr,0,0,dpr,0,0);}
  demo.style.display="none";status.textContent="";
  started=performance.now();raf=requestAnimationFrame(draw);
  talk("TapNest 模型加载成功！");
 }catch(e){
  rig=null;demo.textContent="⚠️";status.textContent=String(e.message||e);
 }
}
initialize();
})();
