name: TapNest GPT Edition Android CI

on:
  push:
    branches: [personal/gpt-edition]
  workflow_dispatch:

# GPT-only product line. Do NOT attach this workflow to main or SullyOS branches.
concurrency:
  group: tapnest-gpt-edition-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-gpt-edition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Use official Gradle distribution
        run: |
          sed -i 's|^distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip|' gradle/wrapper/gradle-wrapper.properties
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Live2D assets from the shared base
        working-directory: live2d-web
        run: |
          npm install --no-audit --no-fund
          npm run build
          test -s ../app/src/main/assets/live2d/engine.js
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew testDebugUnitTest
      - name: Compile Android instrumented tests
        run: ./gradlew assembleDebugAndroidTest
      - name: Lint
        run: ./gradlew lintDebug
      - name: Build GPT Edition debug APK
        run: ./gradlew assembleDebug

      - name: Set up persistent signing identity (GPT package only)
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_SEED: ${{ secrets.TAPNEST_SIGNING_SEED }}
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            if [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
              echo "::error::Missing required signing credentials"; exit 1
            fi
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/tapnest-gpt.keystore"
            chmod 600 "$RUNNER_TEMP/tapnest-gpt.keystore"
            echo "::add-mask::$STORE_PASS"
            echo "::add-mask::$KEY_PASS"
            {
              echo "SIGNING_STORE_FILE=$RUNNER_TEMP/tapnest-gpt.keystore"
              echo "SIGNING_STORE_PASSWORD=$STORE_PASS"
              echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
              echo "SIGNING_KEY_PASSWORD=$KEY_PASS"
              echo "GPT_SIGNING_READY=true"
            } >> "$GITHUB_ENV"
          elif [ -n "$SIGNING_SEED" ]; then
            python3 -m venv "$RUNNER_TEMP/tapnest-gpt-py"
            "$RUNNER_TEMP/tapnest-gpt-py/bin/pip" install --quiet 'cryptography==46.0.4'
            TAPNEST_SIGNING_SEED="$SIGNING_SEED" "$RUNNER_TEMP/tapnest-gpt-py/bin/python" \
              scripts/signing_from_seed.py --out "$RUNNER_TEMP/tapnest-gpt.p12" \
              --password-file "$RUNNER_TEMP/tapnest-gpt.pass"
            STORE_PASS="$(cat "$RUNNER_TEMP/tapnest-gpt.pass")"
            echo "::add-mask::$STORE_PASS"
            {
              echo "SIGNING_STORE_FILE=$RUNNER_TEMP/tapnest-gpt.p12"
              echo "SIGNING_STORE_TYPE=pkcs12"
              echo "SIGNING_STORE_PASSWORD=$STORE_PASS"
              echo "SIGNING_KEY_ALIAS=tapnest"
              echo "SIGNING_KEY_PASSWORD=$STORE_PASS"
              echo "GPT_SIGNING_READY=true"
            } >> "$GITHUB_ENV"
          else
            echo "::notice::No fixed signature secret: GPT debug package only. Do not present as updateable release."
          fi

      - name: Build GPT edition release
        if: env.GPT_SIGNING_READY == 'true'
        run: ./gradlew assembleRelease

      - name: Verify signed package is GPT edition (never standard app)
        if: env.GPT_SIGNING_READY == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" >/dev/null
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.tapnest.pet.gpt'"
          printf '%s\n' "$BADGING" | grep -Fq "application-label:'点点栖 GPT版'"
          mkdir -p app/build/outputs/apk/gpt
          cp "$APK" "app/build/outputs/apk/gpt/点点栖 GPT版.apk"

      - name: Upload upgradeable, fixed-signature GPT edition APK
        if: env.GPT_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TapNest-GPT-Edition-Signed
          path: app/build/outputs/apk/gpt/点点栖 GPT版.apk

      - name: Upload non-updateable GPT debug package
        uses: actions/upload-artifact@v4
        with:
          name: TapNest-GPT-Edition-Debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Build independent GPT test package (different ID; never overwrites release)
        run: ./gradlew assembleDebug -Ptapnest.parallelRestore=true
      - name: Verify isolated GPT test package
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk |
            grep -Fq "package: name='com.tapnest.pet.gpt.test'"
      - name: Upload isolated test APK
        uses: actions/upload-artifact@v4
        with:
          name: TapNest-GPT-Edition-Isolated-Test
          path: app/build/outputs/apk/debug/app-debug.apk
